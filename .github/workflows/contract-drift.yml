name: Contract Drift Check
on:
  pull_request:
    paths:
      - 'web-ai/**'
      - 'test/fixtures/**'
      - 'test/unit/web-ai-contract-audit.test.mjs'
      - 'test/unit/web-ai-eval*.test.mjs'
      - 'test/unit/web-ai-dom-scrubber.test.mjs'
      - 'scripts/run-web-ai-eval.mjs'
      - 'structure/**'
      - '.github/workflows/contract-drift.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mjs'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  fixture-drift:
    runs-on: ubuntu-latest
    # Runs on PRs touching the paths above, and weekly on the schedule so
    # dependency updates that move the fixtures still get caught.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # No browser install step: every command below runs against recorded
      # fixtures. `npx playwright install` used to sit here, which fetched a
      # playwright version unrelated to this repo's pinned playwright-core and
      # planted a chromium revision nothing here resolves.
      - run: npm run test:contract-drift
      - run: npm run test:eval
      - run: npm run test:eval-fixtures
      - run: npm run eval:web-ai:fixtures

# A `live-drift` job used to sit here, scheduled weekly with
# `AGBROWSE_DRIFT_MODE: live` and an alert webhook. It never checked a live
# provider: nothing in this repository reads AGBROWSE_DRIFT_MODE, so it ran the
# same fixture command as the job above, and `continue-on-error: true` meant its
# `if: failure()` alert could not fire either. Auditing a live provider needs a
# signed-in browser session, which a GitHub runner does not have — so this is
# not a gap to fill here. Fixture drift is covered above; live drift is caught
# by running `agbrowse web-ai doctor` against a real session.
