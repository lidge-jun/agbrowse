<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sanitized Perplexity fixture</title></head>
<body data-provider="perplexity">
  <button type="button" aria-label="Model">Model</button>
  <div role="menu" data-perplexity-model-picker data-generation="1">
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="best">Best</div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="sonar-2">Sonar 2</div>
    <div role="menuitemradio" aria-checked="true" data-state="checked" data-model-alias="gpt-5.6-terra">GPT-5.6 Terra</div>
    <div role="menuitemcheckbox" data-thinking-owner="gpt-5.6-terra">Thinking<button role="switch" aria-label="Thinking" aria-checked="false" data-state="unchecked"></button></div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="gemini-3.1-pro">Gemini 3.1 Pro</div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="claude-sonnet-5">Claude Sonnet 5</div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="glm-5.2">GLM 5.2</div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="kimi-k2.6">Kimi K2.6</div>
    <div role="menuitemradio" aria-checked="false" data-state="unchecked" data-model-alias="nemotron-3-ultra">Nemotron 3 Ultra</div>
    <div role="menuitem" data-model-alias="gpt-5.6-sol">GPT-5.6 Sol<svg aria-hidden="true"><use href="#pplx-icon-lock"></use></svg></div>
    
  </div></body></html>
