<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sanitized Perplexity fixture</title></head>
<body data-provider="perplexity">
    <div><header>WRAPPER_TOKEN</header><main><div>
  <div class="composer-shell">
    <div id="ask-input" role="textbox" contenteditable="true" aria-label="Ask a question" data-eval-intent="composer.fill" data-eval-ref="p-composer"></div>
    <button type="button" aria-label="Add files or tools" data-eval-intent="upload.open" data-eval-ref="p-upload">Add files or tools</button>
    <button type="button" aria-label="Submit" data-eval-intent="send.click" data-eval-ref="p-send">Submit</button>
  </div></div><div><div>
  <section class="perplexity-response" data-agbrowse-perplexity-response="committed" >
    <div data-answer-text>ANSWER_TOKEN</div>
    <footer>
      <button type="button" aria-label="Copy" data-eval-intent="copy.click" data-eval-ref="p-copy">Copy</button>
      <button type="button" aria-label="2 sources">2 sources</button>
      <button type="button">Share</button>
    </footer>
  </section></div></div></main></div></body></html>
