 <!doctype html>
 <html lang="en">
   <head>
     <meta charset="utf-8">
     <title>Sanitized ChatGPT GPT-5.6 Chat picker fixture</title>
   </head>
   <body data-provider="chatgpt" data-variant="gpt56-chat">
     <header>
       <div role="radiogroup" aria-label="Composer surface">
         <button
           type="button"
           role="radio"
           aria-checked="true"
           data-state="on"
           data-radix-collection-item
           data-eval-key="surface.chat"
           data-eval-label="Chat"
         >Chat</button>
         <button
           type="button"
           role="radio"
           aria-checked="false"
           data-state="off"
           data-radix-collection-item
           data-eval-key="surface.work"
           data-eval-label="Work"
         >Work</button>
       </div>
     </header>

     <main aria-label="ChatGPT">
       <form aria-label="Prompt composer" data-eval-key="chat.composer">
         <button
           type="button"
           aria-haspopup="menu"
           aria-expanded="true"
           aria-controls="fixture-chat-intelligence-menu"
           data-eval-key="chat.picker-trigger"
           data-eval-label="High"
         >High</button>
         <div
           role="textbox"
           contenteditable="true"
           aria-label="Message ChatGPT"
           data-eval-intent="composer.fill"
           data-eval-ref="chatgpt-gpt56-chat-composer"
         ></div>
         <button
           type="button"
           aria-label="Add photos and files"
           data-testid="composer-plus-btn"
           data-eval-intent="upload.open"
           data-eval-ref="chatgpt-gpt56-chat-upload"
         >Add</button>
         <button
           type="submit"
           aria-label="Send prompt"
           data-eval-intent="send.click"
           data-eval-ref="chatgpt-gpt56-chat-send"
         >Send</button>
       </form>

       <div id="fixture-chat-intelligence-menu" role="menu" data-state="open" data-eval-key="chat.power-shell">
         <div role="menuitem" aria-label="Power" data-eval-key="chat.power-label" data-eval-label="Power">Power</div>
         <div
           role="slider"
           aria-hidden="true"
           aria-valuemin="0"
           aria-valuemax="4"
           aria-valuenow="3"
           data-eval-key="chat.power-slider"
         ></div>
         <button type="button" aria-label="Show compact options" data-eval-key="chat.advanced-toggle">Advanced</button>
         <div
           role="menuitem"
           aria-haspopup="menu"
           data-has-submenu
           tabindex="-1"
           data-eval-key="chat.family-trigger"
           data-eval-label="Model&#10;GPT-5.6 Sol"
         ><span>Model</span><span>GPT-5.6 Sol</span></div>
         <div
           role="menuitem"
           aria-haspopup="menu"
           data-has-submenu
           tabindex="-1"
           data-eval-key="chat.effort-trigger"
           data-eval-label="Effort&#10;Extra High"
         ><span>Effort</span><span>Extra High</span></div>
       </div>

       <template data-eval-state="family-submenu-open">
         <div role="menu" data-state="open" data-eval-key="chat.family-submenu">
           <div role="menuitemradio" aria-checked="true" data-eval-key="chat.family.gpt-5.6-sol" data-eval-label="GPT-5.6 Sol"><span>GPT-5.6 Sol</span></div>
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.family.gpt-5.5" data-eval-label="GPT-5.5"><span>GPT-5.5</span></div>
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.family.o3" data-eval-label="o3"><span>o3</span></div>
         </div>
       </template>
       <template data-eval-state="effort-submenu-open">
         <div role="menu" data-state="open" data-eval-key="chat.effort-submenu">
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.tier.instant" data-eval-label="Instant"><span>Instant</span></div>
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.tier.medium" data-eval-label="Medium"><span>Medium</span></div>
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.tier.high" data-eval-label="High"><span>High</span></div>
           <div role="menuitemradio" aria-checked="true" data-eval-key="chat.tier.extra-high" data-eval-label="Extra High"><span>Extra High</span></div>
           <div role="menuitemradio" aria-checked="false" data-eval-key="chat.tier.pro" data-eval-label="Pro"><span>Pro</span></div>
         </div>
       </template>
     </main>
   </body>
 </html>
